services:
  db:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    environment:
      - POSTGRES_DB=cq_travel
      - POSTGRES_USER=cq
      - POSTGRES_PASSWORD=cq
    ports:
      - "5514:5432"
    volumes:
      - cq_travel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cq -d cq_travel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8514:8080"
    environment:
      - PORT=8080
      - GRAPH_K=6
      - GRAPH_MAX_DISTANCE_METERS=15000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=cq_travel
      - DB_USER=cq
      - DB_PASSWORD=cq
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    ports:
      - "3514:80"
    depends_on:
      - backend

volumes:
  cq_travel_db:
